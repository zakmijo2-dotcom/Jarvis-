name: Fast APK Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      fast_mode:
        description: 'Fast APK build (skips slow R8 minification for rapid APK output)'
        required: false
        type: boolean
        default: true
      run_checks:
        description: 'Run unit tests and Android Lint before building APK'
        required: false
        type: boolean
        default: false
      build_aab:
        description: 'Also build Google Play App Bundle (.aab)'
        required: false
        type: boolean
        default: false
      publish_github_release:
        description: 'Publish APK to GitHub Releases on manual run'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Tag name for manual GitHub Release (e.g. v1.0.0; optional)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1 with Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Optional Unit Tests & Lint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_checks }}
        run: gradle :app:testDebugUnitTest :app:lintDebug --parallel --build-cache --no-daemon

      - name: Prepare Release Signing Keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${{ runner.temp }}/ci-upload-key.jks"
          rm -f "$KEYSTORE_FILE"

          if [[ -n "$KEYSTORE_B64" ]]; then
            if [[ -z "$STORE_PW" ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set, but ANDROID_STORE_PASSWORD secret is missing."
              exit 1
            fi
            RESOLVED_KEY_PW="${KEY_PW:-$STORE_PW}"
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"

            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PW" -alias upload >/dev/null 2>&1; then
              echo "::error::Keystore decoded, but verification failed for alias 'upload' or ANDROID_STORE_PASSWORD."
              exit 1
            fi

            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$RESOLVED_KEY_PW" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=production" >> "$GITHUB_ENV"
          else
            EPHEMERAL_PW="jarvis-ci-auto-key"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$EPHEMERAL_PW" \
              -keypass "$EPHEMERAL_PW" \
              -dname "CN=JARVIS Android, OU=Mobile, O=JARVIS, L=Algiers, ST=DZ, C=DZ"

            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$EPHEMERAL_PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EPHEMERAL_PW" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=auto-signed" >> "$GITHUB_ENV"
          fi

      - name: Build Signed APK
        shell: bash
        env:
          FAST_MODE: ${{ github.event_name != 'workflow_dispatch' || inputs.fast_mode }}
          BUILD_AAB: ${{ github.event_name == 'workflow_dispatch' && inputs.build_aab }}
        run: |
          set -euo pipefail
          GRADLE_ARGS=(":app:assembleRelease" "--parallel" "--build-cache" "-x" "lint" "-x" "test" "--no-daemon")

          if [[ "$FAST_MODE" == "true" ]]; then
            GRADLE_ARGS+=("-PfastApk=true")
          fi

          if [[ "$BUILD_AAB" == "true" ]]; then
            GRADLE_ARGS+=(":app:bundleRelease")
          fi

          gradle "${GRADLE_ARGS[@]}"

      - name: Stage Signed APK & SHA-256 Checksums
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="${{ runner.temp }}/release-dist"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          APK_FILE=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          AAB_FILE=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' 2>/dev/null | head -n 1 || true)
          MAPPING_FILE="app/build/outputs/mapping/release/mapping.txt"

          if [[ -z "$APK_FILE" || ! -f "$APK_FILE" ]]; then
            echo "::error::Signed Release APK was not generated."
            exit 1
          fi

          cp "$APK_FILE" "$DIST_DIR/JARVIS-v1.0.0.apk"
          cp "$APK_FILE" "$DIST_DIR/jarvis-app-release.apk"

          if [[ -n "$AAB_FILE" && -f "$AAB_FILE" ]]; then
            cp "$AAB_FILE" "$DIST_DIR/jarvis-app-release.aab"
          fi
          if [[ -f "$MAPPING_FILE" ]]; then
            cp "$MAPPING_FILE" "$DIST_DIR/jarvis-release-mapping.txt"
          fi

          (cd "$DIST_DIR" && sha256sum * > SHA256SUMS.txt)

          APK_SIZE=$(du -h "$DIST_DIR/JARVIS-v1.0.0.apk" | cut -f1)
          {
            echo "## J.A.R.V.I.S v1.0.0 — Ready-to-Install APK"
            echo "- **APK File:** \`JARVIS-v1.0.0.apk\` (${APK_SIZE})"
            echo "- **Signing mode:** \`${SIGNING_MODE}\`"
            echo ""
            echo "### SHA-256 Checksums"
            echo '```'
            cat "$DIST_DIR/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean Up Temporary Keystore
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/ci-upload-key.jks" "${{ github.workspace }}/my-upload-key.jks"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v1.0.0-APK
          path: ${{ runner.temp }}/release-dist/*
          retention-days: 30

      - name: Resolve Release Tag Name
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="v1.0.0-build.${RUN_NUM}"
          fi
          echo "RESOLVED_RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Publish APK to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RESOLVED_RELEASE_TAG }}
          name: J.A.R.V.I.S Android ${{ env.RESOLVED_RELEASE_TAG }}
          generate_release_notes: true
          prerelease: false
          files: ${{ runner.temp }}/release-dist/*
