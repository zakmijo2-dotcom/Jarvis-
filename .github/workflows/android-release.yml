name: Fast APK Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for GitHub Release (e.g. v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'
      publish_github_release:
        description: 'Publish APK to GitHub Releases'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-apk:
    name: Package & Release Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage Signed APK & SHA-256 Checksums
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="${{ runner.temp }}/release-dist"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          if [[ -f "JARVIS-v1.0.0.apk" ]]; then
            echo "==> Using pre-built signed JARVIS-v1.0.0.apk from repository."
            cp "JARVIS-v1.0.0.apk" "$DIST_DIR/JARVIS-v1.0.0.apk"
          else
            echo "::error::JARVIS-v1.0.0.apk not found in repository root."
            exit 1
          fi

          (cd "$DIST_DIR" && sha256sum JARVIS-v1.0.0.apk > SHA256SUMS.txt)

          APK_SIZE=$(du -h "$DIST_DIR/JARVIS-v1.0.0.apk" | cut -f1)
          {
            echo "## J.A.R.V.I.S v1.0.0 — Ready-to-Install Signed APK"
            echo "- **APK File:** \`JARVIS-v1.0.0.apk\` (${APK_SIZE})"
            echo ""
            echo "### SHA-256 Checksum"
            echo '```'
            cat "$DIST_DIR/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v1.0.0-APK
          path: ${{ runner.temp }}/release-dist/*
          retention-days: 30

      - name: Resolve Release Tag Name
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="v1.0.0"
          fi
          echo "RESOLVED_RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Publish APK to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RESOLVED_RELEASE_TAG }}
          name: J.A.R.V.I.S Android ${{ env.RESOLVED_RELEASE_TAG }}
          generate_release_notes: true
          prerelease: false
          files: ${{ runner.temp }}/release-dist/*
