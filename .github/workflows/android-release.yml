name: Fast APK Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      fast_mode:
        description: 'Fast APK build (skips slow R8 minification for rapid APK output)'
        required: false
        type: boolean
        default: true
      publish_github_release:
        description: 'Publish APK to GitHub Releases'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Tag name for GitHub Release (e.g. v1.0.1)'
        required: false
        type: string
        default: 'v1.0.1'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1 with Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Keystores
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # 1. Generate debug keystore for debug builds
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          # 2. Release keystore setup
          KEYSTORE_FILE="${{ runner.temp }}/ci-upload-key.jks"
          rm -f "$KEYSTORE_FILE"

          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            RESOLVED_KEY_PW="${KEY_PW:-$STORE_PW}"
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$RESOLVED_KEY_PW" >> "$GITHUB_ENV"
          else
            EPHEMERAL_PW="jarvis-ci-auto-key"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$EPHEMERAL_PW" \
              -keypass "$EPHEMERAL_PW" \
              -dname "CN=JARVIS Android, OU=Mobile, O=JARVIS, L=Algiers, ST=DZ, C=DZ"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$EPHEMERAL_PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EPHEMERAL_PW" >> "$GITHUB_ENV"
          fi

      - name: Build Release & Debug APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:assembleDebug -PfastApk=true --parallel --build-cache -x lint -x test --no-daemon

      - name: Stage APKs & Generate Checksums
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="${{ runner.temp }}/release-dist"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)

          if [[ -z "$RELEASE_APK" || ! -f "$RELEASE_APK" ]]; then
            echo "::error::Signed Release APK was not generated."
            exit 1
          fi

          cp "$RELEASE_APK" "$DIST_DIR/Jarvis-release.apk"
          if [[ -n "$DEBUG_APK" && -f "$DEBUG_APK" ]]; then
            cp "$DEBUG_APK" "$DIST_DIR/Jarvis-debug.apk"
          fi

          (cd "$DIST_DIR" && sha256sum *.apk > SHA256SUMS.txt)

          {
            echo "## J.A.R.V.I.S Android APK Build"
            echo "### Generated Artifacts"
            for f in "$DIST_DIR"/*.apk; do
              fname=$(basename "$f")
              fsize=$(du -h "$f" | cut -f1)
              echo "- **$fname** ($fsize)"
            done
            echo ""
            echo "### SHA-256 Checksums"
            echo '```'
            cat "$DIST_DIR/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean Up Temporary Keystore
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/ci-upload-key.jks" "${{ github.workspace }}/debug.keystore"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apks
          path: ${{ runner.temp }}/release-dist/*
          retention-days: 30

      - name: Resolve Release Tag Name
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="v1.0.1"
          fi
          echo "RESOLVED_RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Publish APK to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RESOLVED_RELEASE_TAG }}
          name: J.A.R.V.I.S Android ${{ env.RESOLVED_RELEASE_TAG }}
          generate_release_notes: true
          prerelease: false
          files: ${{ runner.temp }}/release-dist/*
