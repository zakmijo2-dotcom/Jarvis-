name: Android Release CI/CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_checks:
        description: 'Run unit tests and Android Lint before building release'
        required: false
        type: boolean
        default: true
      publish_github_release:
        description: 'Publish APK & AAB to GitHub Releases on manual run'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Tag name for manual GitHub Release (e.g. v1.0.0; optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit Tests & Lint
    if: github.event_name != 'workflow_dispatch' || inputs.run_checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: gradle :app:lintDebug --no-daemon

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html

  build-release:
    name: Build Release APK & AAB
    needs: verify
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release Signing Keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${{ runner.temp }}/ci-upload-key.jks"
          rm -f "$KEYSTORE_FILE"

          if [[ -n "$KEYSTORE_B64" ]]; then
            if [[ -z "$STORE_PW" ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set, but ANDROID_STORE_PASSWORD secret is missing."
              exit 1
            fi
            RESOLVED_KEY_PW="${KEY_PW:-$STORE_PW}"
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"

            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PW" -alias upload >/dev/null 2>&1; then
              echo "::error::Keystore decoded, but verification failed for alias 'upload' or ANDROID_STORE_PASSWORD."
              exit 1
            fi

            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$RESOLVED_KEY_PW" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=production" >> "$GITHUB_ENV"
          else
            EPHEMERAL_PW="jarvis-ci-$(date +%s)-$$"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -storepass "$EPHEMERAL_PW" \
              -keypass "$EPHEMERAL_PW" \
              -dname "CN=JARVIS CI Release, OU=Android, O=JARVIS, L=CI, ST=NA, C=US"

            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$EPHEMERAL_PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EPHEMERAL_PW" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=ephemeral" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not configured. Signed with an ephemeral CI keystore (sideload/testing only; not suitable for Play Store updates)."
          fi

      - name: Build Signed Release APK & App Bundle
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Stage Release Artifacts & SHA-256 Checksums
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="${{ runner.temp }}/release-dist"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          APK_FILE=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          AAB_FILE=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | head -n 1)
          MAPPING_FILE="app/build/outputs/mapping/release/mapping.txt"

          if [[ -z "$APK_FILE" || ! -f "$APK_FILE" ]]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi
          if [[ -z "$AAB_FILE" || ! -f "$AAB_FILE" ]]; then
            echo "::error::Release AAB was not generated."
            exit 1
          fi

          cp "$APK_FILE" "$DIST_DIR/jarvis-app-release.apk"
          cp "$AAB_FILE" "$DIST_DIR/jarvis-app-release.aab"
          if [[ -f "$MAPPING_FILE" ]]; then
            cp "$MAPPING_FILE" "$DIST_DIR/jarvis-release-mapping.txt"
          fi

          (cd "$DIST_DIR" && sha256sum * > SHA256SUMS.txt)

          {
            echo "## JARVIS Android Release Build"
            echo "- **Signing mode:** \`${SIGNING_MODE}\`"
            echo "- **APK:** \`jarvis-app-release.apk\`"
            echo "- **AAB:** \`jarvis-app-release.aab\`"
            echo ""
            echo "### SHA-256 Checksums"
            echo '```'
            cat "$DIST_DIR/SHA256SUMS.txt"
            echo '```'
            if [[ "${SIGNING_MODE}" == "ephemeral" ]]; then
              echo "> **Note:** Configure \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_STORE_PASSWORD\`, and \`ANDROID_KEY_PASSWORD\` in GitHub Repository Secrets (with alias \`upload\`) for permanent Play Store signing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean Up Temporary Keystore
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/ci-upload-key.jks" "${{ github.workspace }}/my-upload-key.jks"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-release-${{ github.run_number }}
          path: ${{ runner.temp }}/release-dist/*
          retention-days: 30

      - name: Resolve Release Tag Name
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="v1.0.0-ci.${RUN_NUM}"
          fi
          echo "RESOLVED_RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RESOLVED_RELEASE_TAG }}
          name: JARVIS Android ${{ env.RESOLVED_RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ env.SIGNING_MODE == 'ephemeral' }}
          files: ${{ runner.temp }}/release-dist/*
