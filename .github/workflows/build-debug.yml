name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Pre-Built Signed APK or Build via Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/apk/debug

          if [[ -f "JARVIS-v1.0.0.apk" ]]; then
            echo "==> Found pre-built signed JARVIS-v1.0.0.apk in repository!"
            cp "JARVIS-v1.0.0.apk" "app/build/outputs/apk/debug/JARVIS-v1.0.0.apk"
            ls -lh "app/build/outputs/apk/debug/JARVIS-v1.0.0.apk"
          else
            echo "==> No pre-built APK found; building with Gradle..."
            if [[ ! -f debug.keystore && -f debug.keystore.base64 ]]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            fi
            gradle :app:assembleDebug --parallel --build-cache -x lint -x test --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
